<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="btoanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Letter B Highlight Gradient -->
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.38" />
    </filter>

    <!-- Spark Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hexagon Shield -->
  <path d="M60 6 L104 31.4 Q108 33.7 108 38.3 L108 81.7 Q108 86.3 104 88.6 L60 114 Q56 116.3 52 114 L8 88.6 Q4 86.3 4 81.7 L4 38.3 Q4 33.7 8 31.4 L52 6 Q56 3.7 60 6 Z"
        fill="url(#btoanGrad)"
        filter="url(#shadow)" />

  <!-- Subtle Inner Border Highlight -->
  <path d="M60 10 L100 33.4 Q104 35.7 104 40.3 L104 79.7 Q104 84.3 100 86.6 L60 110 Q56 112.3 52 110 L12 86.6 Q8 84.3 8 79.7 L8 40.3 Q8 35.7 12 33.4 L52 10 Q56 7.7 60 10 Z"
        fill="none"
        stroke="rgba(255, 255, 255, 0.22)"
        stroke-width="1.5" />

  <!-- Stylized Letter 'B' -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <rect x="30" y="32" width="11" height="56" rx="5.5" fill="url(#bGrad)" />

    <!-- Top Loop -->
    <path d="M38 32 H58 C68 32 75 38 75 47 C75 56 68 61 58 61 H38 Z"
          fill="none"
          stroke="url(#bGrad)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Bottom Loop -->
    <path d="M38 59 H62 C73 59 81 66 81 75 C81 84 73 88 62 88 H38 Z"
          fill="none"
          stroke="url(#bGrad)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- AI Sparks (Four-Point Star) at Top Right -->
  <g transform="translate(84, 26)" filter="url(#glow)">
    <!-- Primary Spark -->
    <path d="M0 -14 Q0 0 14 0 Q0 0 0 14 Q0 0 -14 0 Q0 0 0 -14 Z" fill="url(#sparkGrad)" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Secondary Smaller Spark -->
  <g transform="translate(24, 76)" opacity="0.85">
    <path d="M0 -7 Q0 0 7 0 Q0 0 0 7 Q0 0 -7 0 Q0 0 0 -7 Z" fill="#67E8F9" />
  </g>
</svg>
