<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Vibrant Indigo to Purple Gradient (#6366f1 -> #8b5cf6) -->
    <linearGradient id="btoanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Inner Highlight Border -->
    <linearGradient id="innerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>

    <!-- Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>

    <!-- Glow Filter for B & Sparkle -->
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hexagon -->
  <path d="M60 7 L103 31.8 Q107 34.1 107 38.8 L107 81.2 Q107 85.9 103 88.2 L60 113 Q56 115.3 52 113 L9 88.2 Q5 85.9 5 81.2 L5 38.8 Q5 34.1 9 31.8 L52 7 Q56 4.7 60 7 Z"
        fill="url(#btoanGradient)"
        filter="url(#softShadow)" />

  <!-- Inner Highlight Border -->
  <path d="M60 11 L99 33.5 Q103 35.8 103 40.2 L103 79.8 Q103 84.2 99 86.5 L60 109 Q56 111.3 52 109 L13 86.5 Q9 84.2 9 79.8 L9 40.2 Q9 35.8 13 33.5 L52 11 Q56 8.7 60 11 Z"
        fill="none"
        stroke="url(#innerBorder)"
        stroke-width="1.6" />

  <!-- Stylized White Letter 'B' -->
  <g filter="url(#whiteGlow)">
    <!-- Vertical Spine -->
    <rect x="33" y="32" width="10" height="56" rx="5" fill="#ffffff" />

    <!-- Top Loop of 'B' -->
    <path d="M40 32 H57 C66.5 32 73 37.5 73 46 C73 54.5 66.5 59.5 57 59.5 H40 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="9.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Bottom Loop of 'B' -->
    <path d="M40 59 H61 C71 59 78 65 78 74 C78 83 71 88 61 88 H40 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="9.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- AI Sparks (Four-Point Star) at Top Right -->
  <g transform="translate(86, 26)" filter="url(#whiteGlow)">
    <path d="M0 -13 Q0 0 13 0 Q0 0 0 13 Q0 0 -13 0 Q0 0 0 -13 Z" fill="url(#sparkleGrad)" />
    <circle cx="0" cy="0" r="2.2" fill="#ffffff" />
  </g>

  <!-- Subtle Accent Star at Bottom Left -->
  <g transform="translate(24, 78)" opacity="0.8">
    <path d="M0 -6 Q0 0 6 0 Q0 0 0 6 Q0 0 -6 0 Q0 0 0 -6 Z" fill="#c4b5fd" />
  </g>
</svg>